services:
  backend-api:
    image: ghcr.io/${IMAGE_OWNER:-ngthotuan}/mmo-backend-api:${APP_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: ../infra/docker/backend.Dockerfile
      target: runtime-api
    command: /app/bin/api
    restart: unless-stopped
    env_file: .env
    # DATABASE_URL/REDIS_URL default to host.docker.internal (DB/Redis on the
    # host). On Linux that name only resolves with this mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    volumes:
      - /tmp/mmo-media:/tmp/mmo-media
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend-worker:
    image: ghcr.io/${IMAGE_OWNER:-ngthotuan}/mmo-backend-api:${APP_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: ../infra/docker/backend.Dockerfile
      target: runtime-api
    command: /app/bin/worker
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /tmp/mmo-media:/tmp/mmo-media
    depends_on:
      - backend-api

  backend-video-worker:
    image: ghcr.io/${IMAGE_OWNER:-ngthotuan}/mmo-backend-video-worker:${APP_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: ../infra/docker/backend.Dockerfile
      target: runtime-video
    command: /app/bin/worker --video-only
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /tmp/mmo-media:/tmp/mmo-media
    depends_on:
      - backend-api

  frontend:
    image: ghcr.io/${IMAGE_OWNER:-ngthotuan}/mmo-frontend:${APP_VERSION:-latest}
    build:
      context: ./frontend
      dockerfile: ../infra/docker/frontend.Dockerfile
      args:
        # NEXT_PUBLIC_* is inlined at build time. No bundled nginx — the browser
        # calls the API directly on the published backend port. The FE client adds
        # the /api/v1 prefix itself, so this is the ORIGIN only (no /api suffix).
        # For production set NEXT_PUBLIC_API_URL to your real domain
        # (e.g. https://your-domain.com), served by the host's own reverse proxy.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      backend-api:
        condition: service_healthy
